name: Overlay Trial (cloud Windows)

# TASK_104 follow-up — owner request 2026-09-24: "is there another way you can
# test this without using the vm, maybe a cloud test windows".
#
# Manual-trigger only. Runs the owner-supplied maintenance-screen EXE on a
# THROWAWAY windows-latest runner instead of the local VM, so the Mac is not
# loaded and the unknown binary never touches a real machine. The repo is public,
# so windows-latest minutes are free.
#
# The EXE is fetched from a DRAFT release asset: never committed to git, never
# public. A pinned SHA-256 is verified BEFORE the file is allowed to execute, so
# the cloud run tests byte-for-byte the binary that was analysed locally.
#
# Static analysis of that binary (dnfile, 2026-09-24) — the reason for the two
# measured red flags in scripts/overlay-trial.ps1:
#   * imports user32 SetSystemCursor/CreateCursor/CopyIcon/LoadCursor/DestroyCursor
#     + a _originalCursors cache and HideAllCursors/RestoreAllCursors — the exact
#     global-cursor technique TASK_23 rejected 3/3 (it broke technician control)
#   * imports SetWindowDisplayAffinity — capture visibility depends on the value
#   * imports EnumWindows/GetClassName/IsWindowVisible/ShowWindow and hides ONLY
#     #32768 (system menus), tooltips_class32 and SysShadow — a narrow, safe
#     popup-artifact sweep worth grafting onto our own overlay
#   * no network, file, registry or process APIs at all (user32 + kernel32 only),
#     so it cannot exfiltrate or persist
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the DRAFT release holding the trial EXE
        required: true
        default: overlay-trial-tmp
      asset_name:
        description: Asset filename inside that release
        required: true
        default: windowsexe.exe
      expected_sha256:
        description: SHA-256 the asset must match before it is executed
        required: true
        default: d837f4d72c4075b6d19781f1a35599259c1f64a5d7ab52190f752195c45f8d4b
      run_seconds:
        description: Seconds to leave the overlay running before probing
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  trial:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the trial EXE from the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $rels = Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $rel = $rels | Where-Object { $_.tag_name -eq $env:TAG } | Select-Object -First 1
          if (-not $rel) { throw "draft release '$env:TAG' not found (drafts need a token; check the tag)" }
          $asset = $rel.assets | Where-Object { $_.name -eq $env:ASSET } | Select-Object -First 1
          if (-not $asset) { throw "asset '$env:ASSET' not found in '$env:TAG'" }
          Write-Host "asset id=$($asset.id) size=$($asset.size) state=$($asset.state)"
          Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/octet-stream" } -Uri $asset.url -OutFile "$env:RUNNER_TEMP\trial.exe"
          $sha = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\trial.exe").Hash.ToLower()
          Write-Host "sha256=$sha"
          if ($sha -ne "${{ inputs.expected_sha256 }}") { throw "SHA-256 mismatch: got $sha" }
          Write-Host "hash verified against the locally analysed binary"

      - name: Run the trial probe
        shell: pwsh
        run: |
          ./scripts/overlay-trial.ps1 -ExePath "$env:RUNNER_TEMP\trial.exe" -OutDir "$env:RUNNER_TEMP" -RunSeconds ${{ inputs.run_seconds }}

      - name: Show the trial log
        if: always()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP\overlay-trial.log" | Write-Host

      - name: Upload screenshots + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-trial
          path: |
            ${{ runner.temp }}/overlay-trial.log
            ${{ runner.temp }}/*.png
          if-no-files-found: warn
