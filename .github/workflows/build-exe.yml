name: Build EXE

# Manual-trigger only — "cut a new EXE release from the current commit". Desktop
# releases don't need an automatic build on every push (would burn CI minutes on
# trivial commits), matching how the web deploy is already triggered today.
# Windows-only initially, per Task 27 Part A (Lead Extractor Pro shipped a
# ~290MB Windows EXE; nobody asked for macOS/Linux yet).
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which EXE variant to build
        required: true
        default: extractor
        type: choice
        options:
          - extractor
      tag_name:
        description: Release tag (e.g. v1.4.0) — leave blank to skip a GitHub Release
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # create/upload the GitHub Release (only when a tag is given)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install npm deps
        run: npm ci

      # next build type-checks every route (incl. admin), and prisma.user typed
      # only once the Prisma client is generated. npm ci's postinstall doesn't
      # reliably do this on CI, so generate explicitly before building.
      - name: Generate Prisma client
        run: npx prisma generate

      # tauri-action invokes `tauri build --config src-tauri/tauri.extractor.conf.json`,
      # which runs the bundle's beforeBuildCommand (`npm run exe:build:web` →
      # `next build` + scripts/runtime-assemble.mjs to bundle the standalone
      # runtime + Node binary as the EXE's sidecar) with the env below — so the
      # Extractor-only routes/nav compile in and the EXE is licensable offline
      # (EXE_LICENSE_SECRET is provided as a GH secret; the repo .env is not
      # committed, so CI must supply it).
      - name: Build the Extractor EXE / release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Was hardcoded to "extractor" regardless of the selected variant —
          # harmless today since the dropdown below only offers "extractor"
          # yet, but a real bug waiting to bite silently (exeBuildTarget()
          # defaults to "extractor" rather than failing closed) the moment
          # another variant's option/tauri-config is added. Fixed to track
          # the actual input now, before that happens.
          BUILD_TARGET: ${{ github.event.inputs.variant }}
          SPACEWORKER_LOCAL_EXE: "true"
          EXE_LICENSE_SECRET: ${{ secrets.EXE_LICENSE_SECRET }}
          # For a release build the whole app (incl. admin/api) compiles, and its
          # modules construct/validate secrets at eval time. Mirror the local build
          # environment so `next build` passes; the EXE itself never uses these at
          # runtime (runtime-assemble scrubs .env-downstream and is fully local).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          INTERNAL_BEARER_TOKEN: ${{ secrets.INTERNAL_BEARER_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          MAILBOX_ENCRYPTION_KEY: ${{ secrets.MAILBOX_ENCRYPTION_KEY }}
          CHANNELRY_AI_API_KEY: ${{ secrets.CHANNELRY_AI_API_KEY }}
          PORT: ${{ secrets.PORT }}
          BROWSER_PROFILE_BASE_DIR: ${{ secrets.BROWSER_PROFILE_BASE_DIR }}
        with:
          projectPath: .
          args: --config src-tauri/tauri.extractor.conf.json
          tagName: ${{ github.event.inputs.tag_name }}
          releaseName: "SpaceWorker OS — ${{ github.event.inputs.variant }}"
          releaseBody: "Manual-cut desktop release from the current commit."
          releaseDraft: true

      # No tag was given => tauri-action skips Release uploads. Always surface the
      # installer as a downloadable run artifact so we can inspect it immediately.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaceworker-extractor-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.nsis.zip
          if-no-files-found: error