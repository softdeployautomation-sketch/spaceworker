name: Android APK (rc-agent)

# T254 — build the vendored rc-agent APK on a GitHub runner.
# The Mac host has no JDK/Android SDK/adb/Docker (and only ~3 GiB free), so CI
# is the supported build path for Phase 1. Push to the T254 branch (or run
# workflow_dispatch) and download the `spaceworker-rc-apk` artifact.
#
# Deploy is unaffected: this workflow only uploads an artifact; it never ships.

on:
  push:
    branches: [task-254-android-agent]
    paths:
      - "android-rc/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-rc
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image already ships an Android SDK (ANDROID_HOME).
      # Do NOT use android-actions/setup-android@v3 here: it runs
      # `sdkmanager tools`, a package removed from current cmdline-tools, and
      # fails before any Gradle work starts.
      - name: Install SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "SDK=$SDK"
          echo "SDKMGR=$SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Managed Gradle install + dependency cache. This avoids the wrapper's
      # own distribution download, which intermittently 504s from
      # services/downloads.gradle.org on hosted runners.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Debug keystore (Phase 1)
        run: gradle --no-daemon createDebugKeystore

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Assemble release APK (debug-signed, Phase 1)
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: spaceworker-rc-apk
          if-no-files-found: error
          path: |
            android-rc/app/build/outputs/apk/debug/app-debug.apk
            android-rc/app/build/outputs/apk/release/app-release.apk
