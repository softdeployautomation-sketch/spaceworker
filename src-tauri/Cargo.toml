[package]
name = "spaceworker-exe"
version = "0.1.0"
description = "SpaceWorker OS — Lead Extractor desktop app"
authors = ["SpaceWorker"]
license = "Proprietary"
edition = "2021"

# Generated by `cargo new`; kept minimal so the desktop (cdylib target) stays the
# only build surface. Hand-written by Cline per Tauri v2 scaffolding conventions.

# Generated by `cargo new`; kept as a plain desktop binary (no `[lib]` cdylib target —
# that indirection is only needed for Tauri mobile packaging, which SpaceWorker does
# not target; the Windows/macOS desktop EXEs build straight from `src/main.rs`).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

# "devtools" — Tauri strips right-click "Inspect Element" from release builds by
# default; without this, diagnosing a real WebView2-only rendering bug (like the
# blank Actions-dropdown one found live 2026-09-21) requires guessing blind or
# fighting WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS (which Tauri doesn't honor —
# tried it live, no listener ever came up on the requested debug port). This is
# a debugging aid only — it doesn't change any user-facing behavior, the panel
# stays closed unless someone deliberately right-clicks and opens it.
tauri = { version = "2", features = ["devtools"] }

# Task 57 Bug 2 — the EXE's Export CSV silently no-ops because WebView2 swallows the
# browser Blob→<a download> pattern. These two plugins give the EXE the standard
# native "Save As" flow (plugin-dialog for the file picker, plugin-fs for the actual
# write to the user-chosen path), registered in main.rs. The selected path is
# auto-scoped by the dialog plugin, so capabilities only needs dialog:default plus
# fs:allow-write-text-file — no broad fs write grant.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Keep the dependency surface intentionally thin. The packaged EXE spawns the
# bundled Node/Next runtime (the production sidecar, see scripts/runtime-assemble.mjs)
# using std::process::Command in main.rs — no extra Tauri plugin is needed. serde
# is here for any future Rust-side command plumbing; it isn't used yet.
serde = { version = "1", features = ["derive"] }
