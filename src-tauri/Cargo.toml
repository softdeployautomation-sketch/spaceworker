[package]
name = "spaceworker-exe"
version = "0.1.0"
description = "SpaceWorker OS — Lead Extractor desktop app"
authors = ["SpaceWorker"]
license = "Proprietary"
edition = "2021"

# Generated by `cargo new`; kept minimal so the desktop (cdylib target) stays the
# only build surface. Hand-written by Cline per Tauri v2 scaffolding conventions.

# Generated by `cargo new`; kept as a plain desktop binary (no `[lib]` cdylib target —
# that indirection is only needed for Tauri mobile packaging, which SpaceWorker does
# not target; the Windows/macOS desktop EXEs build straight from `src/main.rs`).

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }

# Keep the dependency surface intentionally thin for this slice. The packaged EXE
# will later need a shell sidecar to spawn the local Node/Next runtime — that uses
# tauri-plugin-shell, added in the slice that wires production packaging (this
# first slice runs the dev shell against `next dev` via beforeDevCommand, so the
# window needs no Rust-side process management yet).
serde = { version = "1", features = ["derive"] }