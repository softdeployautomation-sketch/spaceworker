<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Viewer — android.spaceworker.top</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0c10; color: #c5c6c7; height: 100vh; overflow: hidden; }
  header { background: #1f2833; padding: 12px 20px; border-bottom: 1px solid #45a29e; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 16px; color: #45a29e; letter-spacing: 0.5px; }
  .status { font-size: 12px; color: #66fcf1; font-family: monospace; }
  main { display: flex; height: calc(100vh - 50px); }
  .sidebar { width: 320px; background: #12181f; border-right: 1px solid #45a29e; overflow-y: auto; padding: 16px; flex-shrink: 0; }
  .stage { flex: 1; background: #0b0c10; position: relative; display: flex; flex-direction: column; overflow: hidden; }
  .device-card { background: #1f2833; border: 1px solid #45a29e; border-radius: 8px; padding: 12px; margin-bottom: 12px; cursor: pointer; transition: background 0.2s; }
  .device-card:hover { background: #2a3b4d; }
  .device-card.connected { border-color: #66fcf1; background: #1b3a36; }
  .device-card.offline { opacity: 0.6; border-color: #444; }
  .device-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; display: inline-block; margin-right: 6px; }
  .dot.online { background: #4cd97b; box-shadow: 0 0 6px #4cd97b; }
  .dot.offline { background: #ff6b6b; }
  .device-meta { font-size: 11px; color: #95a5a6; margin-bottom: 8px; }
  .device-meta span { margin-right: 12px; }
  .btn { width: 100%; padding: 10px; border: 1px solid #45a29e; background: transparent; color: #45a29e; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; color: #555; border-color: #555; }
  .btn.connected { background: #45a29e; color: #0b0c10; }
  .btn.danger { border-color: #ff6b6b; color: #ff6b6b; }
  .btn.danger.connected { background: #ff6b6b; color: #0b0c10; }
  .canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; overflow: hidden; }
  canvas { max-width: 100%; max-height: 100%; object-fit: contain; background: #111; }
  .no-signal { position: absolute; color: #444; font-size: 14px; }
  .log-pane { position: absolute; bottom: 0; left: 0; right: 0; height: 140px; background: rgba(11, 12, 16, 0.9); border-top: 1px solid #45a29e; overflow-y: auto; font-family: monospace; font-size: 11px; padding: 8px; display: none; }
  .log-pane.visible { display: block; }
  .log-entry { margin: 2px 0; padding: 2px 4px; border-radius: 3px; }
  .log-entry.dev { color: #66fcf1; }
  .log-entry.viewer { color: #45a29e; }
  .log-entry.error { color: #ff6b6b; }
  .hint { font-size: 11px; color: #66fcf1; margin-top: 6px; }
  input[type="text"] { width: 100%; padding: 6px; background: #0b0c10; border: 1px solid #45a29e; color: #c5c6c7; border-radius: 4px; font-family: monospace; font-size: 11px; }
  .toggle-group { margin-top: 10px; font-size: 12px; color: #95a5a6; }
  .toggle-group label { display: block; margin: 4px 0; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>RC Viewer</h1>
  <div class="status" id="status">Disconnected</div>
</header>
<main>
  <div class="sidebar">
    <div style="font-weight:600; font-size:13px; margin-bottom:12px; color:#45a29e;">Devices</div>
    <div id="deviceList">Loading devices…</div>
    <div class="toggle-group" id="h264Notice" style="display:none;">
      H.264 requires MediaProjection opt-in on the device; using JPEG.
    </div>
  </div>
  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="no-signal" id="noSignal">No active session</div>
    </div>
    <div class="log-pane" id="logPane">
      <div id="logContent"></div>
    </div>
  </div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
