# android.spaceworker.top vhost (T254-B)
# :80 -> ACME webroot + 301 to https
# :443 -> /api/ -> 127.0.0.1:8090 ; /relay -> 127.0.0.1:8081 (WSS upgrade) ; / -> /opt/android-rc/web

server {
    listen 80;
    server_name android.spaceworker.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name android.spaceworker.top;

    ssl_certificate /etc/letsencrypt/live/android.spaceworker.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/android.spaceworker.top/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/android.spaceworker.top/chain.pem;

    # Proxy API (JSON REST + go-auth endpoints for Mosquitto)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Relay WebSocket (WSS)
    location /relay {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static viewer
    location / {
        alias /opt/android-rc/web/;
        try_files $uri $uri/ /index.html;
    }
}