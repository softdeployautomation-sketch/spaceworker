# Mosquitto configuration for android-rc (T254-B Phase 1)
# NOTE Phase 1: allow_anonymous true on TLS 8883 to deploy quickly.
# MQTT topic auth is NOT broker-enforced in Phase 1; session security is
# enforced by the WS relay HMAC token. Harden MQTT auth (go-auth/EMQX) in T254-C.
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

listener 1883 127.0.0.1
allow_anonymous true

listener 8883
allow_anonymous true
certfile /etc/letsencrypt/live/android.spaceworker.top/fullchain.pem
keyfile /etc/letsencrypt/live/android.spaceworker.top/privkey.pem
