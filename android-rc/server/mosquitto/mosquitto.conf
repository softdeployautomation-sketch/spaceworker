# Mosquitto configuration for android-rc (T254-B)
# Listener 8883 TLS (public) — certs mounted from /etc/letsencrypt on the box.
# Dev profile: plain 1883, same auth/ACL.

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# --- Listener 1883 (dev, plaintext, same go-auth backend) ---
listener 1883
allow_anonymous false
auth_plugin /mosquitto/go-auth.so
auth_opt_backend http
auth_opt_http__host rc-api
auth_opt_http__port 8090
auth_opt_http__api_version 4
auth_opt_http__get_user http://rc-api:8090/mqtt/auth
auth_opt_http__post_user http://rc-api:8090/mqtt/auth
auth_opt_http__get_superuser http://rc-api:8090/mqtt/superuser
auth_opt_http__post_superuser http://rc-api:8090/mqtt/superuser
auth_opt_http__get_acl http://rc-api:8090/mqtt/acl
auth_opt_http__post_acl http://rc-api:8090/mqtt/acl

# --- Listener 8883 (TLS, public) ---
listener 8883
allow_anonymous false
certfile /etc/letsencrypt/live/android.spaceworker.top/fullchain.pem
keyfile /etc/letsencrypt/live/android.spaceworker.top/privkey.pem
# cafile optional for mutual TLS; not required for Phase 1
auth_plugin /mosquitto/go-auth.so
auth_opt_backend http
auth_opt_http__host rc-api
auth_opt_http__port 8090
auth_opt_http__api_version 4
auth_opt_http__get_user http://rc-api:8090/mqtt/auth
auth_opt_http__post_user http://rc-api:8090/mqtt/auth
auth_opt_http__get_superuser http://rc-api:8090/mqtt/superuser
auth_opt_http__post_superuser http://rc-api:8090/mqtt/superuser
auth_opt_http__get_acl http://rc-api:8090/mqtt/acl
auth_opt_http__post_acl http://rc-api:8090/mqtt/acl

# Per-topic ACL is enforced by the go-auth /mqtt/acl endpoint.
# The static acl file below is only a fallback if go-auth is unreachable.
acl_file /mosquitto/config/acl