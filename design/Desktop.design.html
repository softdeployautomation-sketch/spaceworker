<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SpaceWorker OS Desktop — Design Reference</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    a { color: #818cf8; }
    .dock-icon { transition: transform .12s ease; cursor: pointer; }
    .dock-icon:hover { transform: translateY(-6px); }
  </style>
</head>
<body>

<div style="width:1440px; height:900px; background:#0b0f17; position:relative; overflow:hidden;">

  <!-- Menu bar -->
  <div style="display:flex; align-items:center; justify-content:space-between; height:32px; padding:0 16px; background:rgba(11,15,23,0.9); border-bottom:1px solid #1c2333; position:relative; z-index:5;">
    <div style="display:flex; align-items:center; gap:18px;">
      <div style="display:flex; align-items:center; gap:7px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" fill="#818cf8"/></svg>
        <span style="font-size:12.5px; font-weight:700; color:#f4f5f7;">SpaceWorker</span>
      </div>
      <span style="font-size:12.5px; color:#8b93a7;">File</span>
      <span style="font-size:12.5px; color:#8b93a7;">Window</span>
      <span style="font-size:12.5px; color:#8b93a7;">Help</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px; font-size:12px; color:#8b93a7;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b93a7" stroke-width="1.8"><path d="M2 12h4l3-9 4 18 3-9h6"/></svg>
      <span>Tue 3 Sep</span>
      <span style="color:#e5e7eb; font-weight:600;">9:41 AM</span>
    </div>
  </div>

  <!-- Desktop background: a STATIC (no animation, no JS) 3D-styled scene —
       translucent app-window panels fixed at real perspective/rotation angles,
       giving genuine depth without needing to move. Transparent enough to sit
       quietly behind the dock/icons. -->
  <div style="position:absolute; inset:0; top:32px; background:
      radial-gradient(60% 50% at 18% 8%, rgba(99,102,241,0.16), transparent 60%),
      radial-gradient(50% 45% at 85% 85%, rgba(99,102,241,0.10), transparent 60%),
      linear-gradient(160deg, #0d1220 0%, #080b12 75%); perspective:1400px; overflow:hidden;">
    <div style="position:absolute; left:10%; top:14%; width:150px; height:100px; border-radius:12px; background:linear-gradient(155deg, rgba(129,140,248,0.10), rgba(99,102,241,0.03)); border:1px solid rgba(129,140,248,0.16); transform:rotateX(12deg) rotateY(-18deg) rotateZ(-3deg); box-shadow:0 30px 50px -20px rgba(0,0,0,0.5);"></div>
    <div style="position:absolute; right:14%; top:10%; width:120px; height:82px; border-radius:11px; background:linear-gradient(155deg, rgba(129,140,248,0.08), rgba(99,102,241,0.02)); border:1px solid rgba(129,140,248,0.13); transform:rotateX(-8deg) rotateY(16deg) rotateZ(4deg); box-shadow:0 26px 44px -18px rgba(0,0,0,0.45);"></div>
    <div style="position:absolute; left:20%; bottom:12%; width:100px; height:70px; border-radius:10px; background:linear-gradient(155deg, rgba(129,140,248,0.07), rgba(99,102,241,0.02)); border:1px solid rgba(129,140,248,0.11); transform:rotateX(6deg) rotateY(-10deg) rotateZ(2deg); box-shadow:0 20px 36px -16px rgba(0,0,0,0.4);"></div>
    <div style="position:absolute; right:22%; bottom:18%; width:170px; height:112px; border-radius:13px; background:linear-gradient(155deg, rgba(129,140,248,0.11), rgba(99,102,241,0.03)); border:1px solid rgba(129,140,248,0.17); transform:rotateX(-10deg) rotateY(14deg) rotateZ(-2deg); box-shadow:0 32px 54px -20px rgba(0,0,0,0.5);"></div>
  </div>

  <!-- Desktop icons (left column, like a real desktop) -->
  <div style="position:absolute; left:28px; top:56px; display:flex; flex-direction:column; gap:22px; z-index:2;">
    <div style="width:76px; display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="width:46px; height:46px; border-radius:12px; background:#1c2333; border:1px solid #29314a; display:flex; align-items:center; justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      </div>
      <span style="font-size:11px; color:#c3c9d6; text-align:center;">Getting Started</span>
    </div>
  </div>

  <!-- Floating windows -->
  <!-- Browser window (partially open, upper-left) -->
  <div style="position:absolute; left:180px; top:96px; width:520px; border-radius:12px; overflow:hidden; border:1px solid #29314a; box-shadow:0 40px 80px -24px rgba(0,0,0,0.6); z-index:3;">
    <div style="display:flex; align-items:center; gap:8px; padding:10px 14px; background:#131826; border-bottom:1px solid #1c2333;">
      <span style="width:9px; height:9px; border-radius:999px; background:#3f4759;"></span>
      <span style="width:9px; height:9px; border-radius:999px; background:#3f4759;"></span>
      <span style="margin-left:8px; font-size:12px; color:#9ca3af; font-weight:600;">Browser</span>
      <span style="margin-left:auto; display:flex; align-items:center; gap:5px; font-size:10.5px; color:#6ee7b7; background:rgba(52,211,153,0.1); padding:3px 8px; border-radius:999px;">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="2.4"><circle cx="12" cy="12" r="9"/></svg>
        Amsterdam
      </span>
    </div>
    <div style="padding:18px; background:#0e1320; display:flex; flex-direction:column; gap:10px;">
      <div style="height:11px; width:65%; border-radius:4px; background:#232a3b;"></div>
      <div style="height:11px; width:42%; border-radius:4px; background:#1c2333;"></div>
      <div style="height:80px; border-radius:9px; background:#161c2b; margin-top:6px;"></div>
    </div>
  </div>

  <!-- Automation window (front, center-right) -->
  <div style="position:absolute; left:560px; top:230px; width:560px; border-radius:12px; overflow:hidden; border:1px solid #29314a; box-shadow:0 50px 100px -20px rgba(0,0,0,0.65); z-index:4;">
    <div style="display:flex; align-items:center; gap:8px; padding:10px 14px; background:#131826; border-bottom:1px solid #1c2333;">
      <span style="width:9px; height:9px; border-radius:999px; background:#3f4759;"></span>
      <span style="width:9px; height:9px; border-radius:999px; background:#3f4759;"></span>
      <span style="margin-left:8px; font-size:12px; color:#9ca3af; font-weight:600;">Automation</span>
    </div>
    <div style="padding:20px; background:#0e1320;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <span style="font-size:12.5px; color:#e5e7eb; font-weight:600;">plumbers in Chicago</span>
        <span style="font-size:11px; color:#6ee7b7; font-weight:600;">Running · 42 leads found</span>
      </div>
      <div style="height:6px; border-radius:3px; background:#1c2333; margin-bottom:16px;"><div style="height:6px; width:68%; border-radius:3px; background:#6366f1;"></div></div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; justify-content:space-between; font-size:11.5px; color:#9ca3af; padding:8px 10px; background:#131826; border-radius:7px;"><span>Ace Plumbing Co.</span><span>ace@aceplumbing.com</span></div>
        <div style="display:flex; justify-content:space-between; font-size:11.5px; color:#9ca3af; padding:8px 10px; background:#131826; border-radius:7px;"><span>Metro Rooter</span><span>info@metrorooter.com</span></div>
      </div>
    </div>
  </div>

  <!-- Dock -->
  <div style="position:absolute; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:flex-end; gap:12px; padding:10px 16px; border-radius:20px; background:rgba(19,24,38,0.85); border:1px solid #29314a; backdrop-filter:blur(10px); z-index:6;">
    <div class="dock-icon" style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <div style="width:48px; height:48px; border-radius:13px; background:linear-gradient(160deg,#1c2333,#161c2b); display:flex; align-items:center; justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"/></svg>
      </div>
      <span style="width:4px; height:4px; border-radius:999px; background:#818cf8;"></span>
    </div>
    <div class="dock-icon" style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <div style="width:48px; height:48px; border-radius:13px; background:linear-gradient(160deg,#1c2333,#161c2b); display:flex; align-items:center; justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.8"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      </div>
      <span style="width:4px; height:4px; border-radius:999px; background:#818cf8;"></span>
    </div>
    <div class="dock-icon" style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <div style="width:48px; height:48px; border-radius:13px; background:linear-gradient(160deg,#1c2333,#161c2b); display:flex; align-items:center; justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      </div>
    </div>
    <div class="dock-icon" style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <div style="width:48px; height:48px; border-radius:13px; background:linear-gradient(160deg,#1c2333,#161c2b); display:flex; align-items:center; justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.8"><path d="M3 11l18-7-7 18-2-8z"/></svg>
      </div>
    </div>
    <div style="width:1px; height:34px; background:#29314a; align-self:center;"></div>
    <div class="dock-icon" style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <div style="width:48px; height:48px; border-radius:13px; background:linear-gradient(160deg,#1c2333,#161c2b); display:flex; align-items:center; justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8b93a7" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
      </div>
    </div>
  </div>

</div>
</body>
</html>
