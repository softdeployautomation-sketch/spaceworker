# Reference copy of the production nginx vhost, manually applied on the VPS at
# /etc/nginx/sites-available/spaceworker.top (symlinked into
# sites-enabled/). NOT part of the automated Build & Deploy pipeline — nginx
# config changes are applied by hand (`nginx -t` then `systemctl reload nginx`)
# and this file exists so the config survives a VPS rebuild instead of only
# living on the one server, the same lesson learned from Task 28's port
# mismatch (systemd unit files silently drifting from what's actually running).
# Keep this file in sync any time the live config changes.

server {
    listen 80;
    server_name spaceworker.top;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name spaceworker.top;

    # Task 56, Mechanism 1 — the literal restart window. During
    # `systemctl restart spaceworker.service` the app process is NOT listening at
    # all; nothing inside Next.js (proxy, a DB flag, anything) can respond because
    # the process doesn't exist yet. Only nginx (always up in front) can serve
    # anything. These error_page directives turn the raw "502 Bad Gateway" (and
    # 503/504) into the static maintenance page below, which is served directly by
    # nginx without proxying to the app. Its inline script polls and reloads the
    # instant the app comes back, so the real page loads automatically.
    #
    # Requires the maintenance.html content from deploy/maintenance.html to be
    # installed at /opt/spaceworker/static/maintenance.html on the VPS (this file
    # is a reference copy — apply by hand with `nginx -t` then
    # `systemctl reload nginx`, same as every nginx change in this repo's deploy).
    # Deploy maintenance switch (owner 2026-09-25): deploy-vps.sh touches this
    # flag before a build and removes it only after the app answers 200, so
    # users see the update page for the WHOLE rebuild — and keep seeing it if the
    # build fails, instead of a raw 502.
    #
    # Two things learned live while building this:
    #  1. The path must be in a VARIABLE. `if (-f /literal/path)` is evaluated at
    #     config load and baked in, so the flag would only work after a reload.
    #  2. `error_page` is NOT consulted for a rewrite-phase `return`, so
    #     `return 503;` produced nginx's default 503 body, not maintenance.html.
    #     An internal rewrite to the static file is what actually serves it.
    #     Consequence: the flag path answers 200 + the update page (a static file
    #     cannot be served with a 503), while the crash path below still answers
    #     502/503/504.
    set $sw_maint_file /var/www/sw-maintenance.on;
    if (-f $sw_maint_file) {
        rewrite ^ /maintenance.html last;
    }

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        alias /opt/spaceworker/static/maintenance.html;
    }

    ssl_certificate /etc/letsencrypt/live/instaweb.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instaweb.top/privkey.pem;

    # Interactive browser streaming (Task 7) — one static route to
    # browser-server's own fixed port (3401). browser-server itself proxies
    # onward to the correct per-session Neko container port using its own
    # in-memory sessionId -> port registry (see browser-server/server.ts) —
    # nginx never needs to know the actual per-session port.
    location /browser/ {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Task 53 — /api/internal/* are worker/scheduler endpoints that MUST only be
    # reachable from the machine itself (legit callers hit http://127.0.0.1:3500
    # directly, bypassing nginx entirely). Before this block they fell through to
    # the catch-all `location /` and were publicly reachable at
    # https://spaceworker.top/api/internal/... with only the app-level
    # bearer check as defense. Restrict them to 127.0.0.1 at the network layer so
    # a misconfigured/blank bearer token can't become a public-internet bypass.
    location ~ ^/api/internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fixed 2026-09-13 — confirmed live 504 at exactly 120s: the AI agent's
    # autonomous seed-mailbox diagnostics (POST /api/agent triggering
    # run_diagnostics) and the human-facing run-diagnostics/test-send routes
    # all synchronously wait on a real IMAP poll of the seed mailbox, which
    # this app's own code documents as taking "up to ~2 minutes" — longer
    # than the general 120s timeout below. A regex location (matched before
    # the plain-prefix location / block) gives just these long-running
    # routes real headroom without loosening the timeout for everything else.
    location ~ ^/api/(agent|campaigns/[^/]+/(run-diagnostics|test-send)) {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 200s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_buffering off;
    }
}
