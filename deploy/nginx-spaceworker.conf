# Reference copy of the production nginx vhost, manually applied on the VPS at
# /etc/nginx/sites-available/spaceworker.instaweb.top (symlinked into
# sites-enabled/). NOT part of the automated Build & Deploy pipeline — nginx
# config changes are applied by hand (`nginx -t` then `systemctl reload nginx`)
# and this file exists so the config survives a VPS rebuild instead of only
# living on the one server, the same lesson learned from Task 28's port
# mismatch (systemd unit files silently drifting from what's actually running).
# Keep this file in sync any time the live config changes.

server {
    listen 80;
    server_name spaceworker.instaweb.top;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name spaceworker.instaweb.top;

    ssl_certificate /etc/letsencrypt/live/instaweb.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instaweb.top/privkey.pem;

    # Interactive browser streaming (Task 7) — one static route to
    # browser-server's own fixed port (3401). browser-server itself proxies
    # onward to the correct per-session Neko container port using its own
    # in-memory sessionId -> port registry (see browser-server/server.ts) —
    # nginx never needs to know the actual per-session port.
    location /browser/ {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Task 53 — /api/internal/* are worker/scheduler endpoints that MUST only be
    # reachable from the machine itself (legit callers hit http://127.0.0.1:3500
    # directly, bypassing nginx entirely). Before this block they fell through to
    # the catch-all `location /` and were publicly reachable at
    # https://spaceworker.instaweb.top/api/internal/... with only the app-level
    # bearer check as defense. Restrict them to 127.0.0.1 at the network layer so
    # a misconfigured/blank bearer token can't become a public-internet bypass.
    location ~ ^/api/internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fixed 2026-09-13 — confirmed live 504 at exactly 120s: the AI agent's
    # autonomous seed-mailbox diagnostics (POST /api/agent triggering
    # run_diagnostics) and the human-facing run-diagnostics/test-send routes
    # all synchronously wait on a real IMAP poll of the seed mailbox, which
    # this app's own code documents as taking "up to ~2 minutes" — longer
    # than the general 120s timeout below. A regex location (matched before
    # the plain-prefix location / block) gives just these long-running
    # routes real headroom without loosening the timeout for everything else.
    location ~ ^/api/(agent|campaigns/[^/]+/(run-diagnostics|test-send)) {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 200s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_buffering off;
    }
}
